<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="30" y="24" width="170" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="115" y="52" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">usuarios</text>
  <text x="115" y="72" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">uid de Auth</text>
  <line x1="200" y1="56" x2="268" y2="56" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="206" y="48" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">ownerId</text>
  <rect x="276" y="24" width="170" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="361" y="52" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">vehiculos</text>
  <text x="361" y="72" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">VEH-001</text>
  <line x1="446" y1="56" x2="514" y2="56" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="452" y="48" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">vehicleId</text>
  <rect x="522" y="24" width="150" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="597" y="52" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">citas</text>
  <text x="597" y="72" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">APT-001</text>
  <line x1="672" y1="56" x2="740" y2="56" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="678" y="48" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">slotId</text>
  <rect x="748" y="24" width="190" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="843" y="52" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">configFranjas</text>
  <text x="843" y="72" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">SLT-001</text>
  <rect x="30" y="160" width="200" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="130" y="188" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">tiposServicio</text>
  <text x="130" y="208" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">SVT-001</text>
  <line x1="230" y1="192" x2="308" y2="192" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="236" y="184" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">serviceTypeId</text>
  <rect x="316" y="160" width="170" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="401" y="188" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">servicios</text>
  <text x="401" y="208" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">SRV-001</text>
  <line x1="486" y1="192" x2="564" y2="192" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="492" y="184" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">serviceOrderId</text>
  <rect x="572" y="160" width="170" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="657" y="188" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">evidencias</text>
  <text x="657" y="208" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">EVD-001</text>
  <rect x="30" y="296" width="230" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="145" y="324" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">tiposMantenimiento</text>
  <text x="145" y="344" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">MNT-001</text>
  <line x1="260" y1="328" x2="360" y2="328" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="266" y="320" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">maintenanceTypeId</text>
  <rect x="368" y="296" width="250" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="493" y="324" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">estadosMantenimiento</text>
  <text x="493" y="344" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">MRC-001</text>
  <text x="30" y="410" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">Otras relaciones, por el campo guardado en el origen</text>
  <text x="30" y="436" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">usuarios a citas por clientId. vehiculos a servicios y a estadosMantenimiento por vehicleId.</text>
  <text x="30" y="458" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">citas a servicios por appointmentId, que puede ser null. tiposServicio a citas por serviceTypeId.</text>
  <text x="30" y="500" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">Colecciones de apoyo (no son entidades del dominio)</text>
  <rect x="30" y="516" width="320" height="88" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="190" y="548" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">contadores</text>
  <text x="190" y="570" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">id = nombre de la colección</text>
  <text x="190" y="588" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">campo value</text>
  <rect x="380" y="516" width="320" height="88" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="540" y="548" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">placas</text>
  <text x="540" y="570" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">id = placa en mayúsculas</text>
  <text x="540" y="588" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">vehicleId, ownerId</text>
  <rect x="730" y="516" width="330" height="88" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="895" y="548" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="700" fill="#1a1a1a">ocupacion</text>
  <text x="895" y="570" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">id = fecha_slotId</text>
  <text x="895" y="588" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">date, slotId, count</text>
  <text x="30" y="640" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">La flecha señala el documento cuyo identificador guarda el campo. No hay JOIN en la consulta:</text>
  <text x="30" y="662" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">el ViewModel lee cada colección y combina los resultados. Los prefijos salen de FirestoreRepository.</text>
  <text x="30" y="692" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">contadores alimenta nextId(). placas se escribe en la misma transacción que crea el vehículo.</text>
  <text x="30" y="714" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">ocupacion guarda el cupo que la transacción de la cita mantiene en más uno o menos uno.</text>
</svg>
