<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1040" viewBox="0 0 1100 1040">
  <rect width="1100" height="1040" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="30" y="16" width="150" height="52" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="105" y="47" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">Usuario</text>
  <rect x="200" y="16" width="150" height="52" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="275" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">LoginScreen</text>
  <text x="275" y="56" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">ui/auth</text>
  <rect x="370" y="16" width="160" height="52" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="450" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">AuthViewModel</text>
  <text x="450" y="56" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">viewmodel</text>
  <rect x="550" y="16" width="180" height="52" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="640" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" font-weight="700" fill="#1a1a1a">FirebaseAuthGateway</text>
  <text x="640" y="56" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">data/auth</text>
  <rect x="750" y="16" width="150" height="52" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="825" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">Firebase Auth</text>
  <text x="825" y="56" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">servicio</text>
  <rect x="920" y="16" width="155" height="52" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="997" y="40" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" font-weight="700" fill="#1a1a1a">SessionViewModel</text>
  <text x="997" y="56" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" fill="#1a1a1a">viewmodel</text>
  <line x1="105" y1="68" x2="105" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="275" y1="68" x2="275" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="450" y1="68" x2="450" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="640" y1="68" x2="640" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="825" y1="68" x2="825" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="997" y1="68" x2="997" y2="900" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="105" y1="110" x2="268" y2="110" stroke="#1a1a1a" stroke-width="1.15" marker-end="url(#arrow)"/>
  <text x="112" y="104" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">1. correo y contraseña</text>
  <line x1="275" y1="168" x2="443" y2="168" stroke="#1a1a1a" stroke-width="1.15" marker-end="url(#arrow)"/>
  <text x="290" y="162" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">2. signIn()</text>
  <rect x="458" y="198" width="176" height="46" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="466" y="216" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">3. formulario y</text>
  <text x="466" y="234" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">validateSignIn</text>
  <line x1="450" y1="280" x2="633" y2="280" stroke="#1a1a1a" stroke-width="1.15" marker-end="url(#arrow)"/>
  <text x="458" y="274" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">4. signInWithEmail</text>
  <line x1="640" y1="332" x2="818" y2="332" stroke="#1a1a1a" stroke-width="1.15" marker-end="url(#arrow)"/>
  <text x="648" y="326" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">5. signInWithEmailAndPassword</text>
  <line x1="818" y1="384" x2="647" y2="384" stroke="#1a1a1a" stroke-width="1.15" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="700" y="378" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">6. uid</text>
  <line x1="633" y1="436" x2="457" y2="436" stroke="#1a1a1a" stroke-width="1.15" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="510" y="430" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">7. uid</text>
  <line x1="443" y1="488" x2="282" y2="488" stroke="#1a1a1a" stroke-width="1.15" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="300" y="482" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">8. authenticatedUid</text>
  <line x1="275" y1="548" x2="990" y2="548" stroke="#1a1a1a" stroke-width="1.15" marker-end="url(#arrow)"/>
  <text x="470" y="540" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">9. onAuthenticated(uid)</text>
  <rect x="850" y="578" width="220" height="56" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="858" y="600" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">10. AuthService.signIn(uid)</text>
  <text x="858" y="618" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">lee usuarios/{uid}</text>
  <line x1="997" y1="670" x2="112" y2="670" stroke="#1a1a1a" stroke-width="1.15" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="250" y="662" font-family="Times New Roman, Times, serif" font-size="13" fill="#1a1a1a">11. Inicio del cliente o Panel del personal, según role</text>
  <rect x="40" y="730" width="1020" height="168" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="56" y="758" font-family="Times New Roman, Times, serif" font-size="15" font-weight="700" fill="#1a1a1a">Registro con correo (mismo desenlace, otro comienzo)</text>
  <text x="56" y="786" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">AuthViewModel.register llama a FirebaseAuthGateway.registerWithEmail. El gateway ejecuta</text>
  <text x="56" y="808" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">createUserWithEmailAndPassword y, con el uid recibido, guarda usuarios/{uid} con role = CLIENT.</text>
  <text x="56" y="830" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">Si ese documento no se puede escribir, borra la cuenta de Authentication y cierra la sesión.</text>
  <text x="56" y="852" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">Si el guardado prospera, el uid sigue el mismo camino: SessionViewModel y AuthService.signIn(uid).</text>
  <text x="56" y="874" font-family="Times New Roman, Times, serif" font-size="14" fill="#1a1a1a">El primer ingreso con Google crea el mismo perfil CLIENT solo cuando usuarios/{uid} todavía no existe.</text>
</svg>
